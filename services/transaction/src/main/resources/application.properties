# Application
spring.application.name=transaction

# Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transaction_db}
spring.datasource.username=${DB_USERNAME:fraudpulse}
spring.datasource.password=${DB_PASSWORD:fraudpulse_dev}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Monitoring & Health Checks
management.endpoints.web.exposure.include=health,info

# Kafka Topics
app.kafka.topics.fraud-events=${FRAUD_EVENTS_TOPIC:fraud-events}
app.kafka.topics.transaction-events=${TRANSACTION_EVENTS_TOPIC:transaction-events}