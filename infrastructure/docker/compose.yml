name: fraudpulse

services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: fraudpulse
      POSTGRES_PASSWORD: fraudpulse_dev
      POSTGRES_DB: transaction_db

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudpulse -d transaction_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: